<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Ledger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Portfolio Ledger</h1>
    <div id="summary" class="summary"></div>
  </header>

  <main>
    <div class="toolbar">
      <button id="addRowBtn">+ Add policy</button>
      <button id="importBtn">Import from Excel</button>
      <label class="toggle"><input id="showDeleted" type="checkbox"> Show deleted</label>
    </div>
    <div class="filter-bar">
      <select id="filterField"></select>
      <input id="filterQuery" type="search" placeholder="Filter…">
      <button id="clearFilterBtn">Clear</button>
      <span id="filterCount" class="filter-count"></span>
    </div>
    <table id="policyTable">
      <thead>
        <tr>
          <th>Policy No</th>
          <th>Instrument</th>
          <th>Institution</th>
          <th>Holder</th>
          <th>Nominee</th>
          <th>Amount Invested</th>
          <th>ROI %</th>
          <th>Maturity Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="policyTableBody"></tbody>
    </table>
  </main>

  <div id="mappingModal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Map Excel columns</h2>
      <p class="modal-sub">Check how each column in your sheet maps to a field. Columns set to "ignore" are skipped.</p>
      <div id="sheetPicker" class="sheet-picker hidden">
        <label for="sheetSelect">Sheet</label>
        <select id="sheetSelect"></select>
      </div>
      <div id="mappingRows" class="mapping-rows"></div>
      <div class="modal-actions">
        <button id="mappingCancelBtn">Cancel</button>
        <button id="mappingCommitBtn">Import</button>
      </div>
    </div>
  </div>

  <script src="filterPolicies.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
